name: 5돌이 daily

on:
  schedule:
    - cron: "40 9 * * 1-5"   # 평일 18:40 KST
  workflow_dispatch:
  push:
    paths:
      - "5돌이/src/**"
      - "5돌이/config.json"
      - ".github/workflows/odol-daily.yml"

permissions:
  contents: write

concurrency:
  group: odol-daily-${{ github.ref }}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 규칙 테스트
        run: |
          python 5돌이/tests/test_rules.py
          python 5돌이/tests/test_parse.py
          python 5돌이/tests/test_gsheet.py
      - name: 일일 배치
        run: python 5돌이/src/run_daily.py
      - name: 데이터 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 5돌이/data
          git diff --cached --quiet && exit 0
          git commit -m "5돌이 데이터 갱신"
          git pull --rebase
          git push
      - name: 구글 시트 반영
        env:
          GSHEET_SA_KEY: ${{ secrets.GSHEET_SA_KEY }}
        run: |
          if [ -z "$GSHEET_SA_KEY" ]; then echo "GSHEET_SA_KEY 없음 - 건너뜀"; exit 0; fi
          pip install -q google-auth requests
          python 5돌이/src/gsheet_sync.py
